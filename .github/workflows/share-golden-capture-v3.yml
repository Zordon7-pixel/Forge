name: Share golden capture v3 (temporary)

on:
  push:
    branches:
      - codex/t_34525c7e-c2-reconcile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/codex/t_34525c7e-c2-reconcile'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_ROOT: /tmp/forge-share-capture-v3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capture twice and verify complete Linux receipts and identical PNGs
        run: |
          set -euo pipefail
          # A fresh root per run attempt prevents reuse of any earlier capture.
          mkdir "$EVIDENCE_ROOT"
          summary="$EVIDENCE_ROOT/summary.txt"
          printf 'source=%s\nref=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$summary"
          trap 'status=$?; printf "capture-step exit=%s\n" "$status" >> "$summary"' EXIT

          # Keep both command and tee exits: a successful tee must never hide failure.
          run_logged() {
            local log="$1"
            shift
            local -a statuses
            printf 'command:' >> "$summary"
            printf ' %q' "$@" >> "$summary"
            printf '\n' >> "$summary"
            if "$@" 2>&1 | tee "$log"; then
              statuses=("${PIPESTATUS[@]}")
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            printf 'exit=%s tee-exit=%s log=%s\n' \
              "${statuses[0]}" "${statuses[1]}" "${log#"$EVIDENCE_ROOT"/}" >> "$summary"
            sha256sum "$log" >> "$summary"
            if (( statuses[0] != 0 )); then return "${statuses[0]}"; fi
            if (( statuses[1] != 0 )); then return "${statuses[1]}"; fi
          }

          # Source/platform receipts exist even if dependency installation fails.
          run_logged "$EVIDENCE_ROOT/preflight.log" bash -euo pipefail -c '
            test "$GITHUB_REF" = refs/heads/codex/t_34525c7e-c2-reconcile
            git rev-parse HEAD > "$EVIDENCE_ROOT/source-sha.txt"
            test "$(cat "$EVIDENCE_ROOT/source-sha.txt")" = "$GITHUB_SHA"
            git status --porcelain --untracked-files=all > "$EVIDENCE_ROOT/checkout-before.txt"
            test ! -s "$EVIDENCE_ROOT/checkout-before.txt"
            test "$CI" = true
            test "$GITHUB_ACTIONS" = true
            uname -a > "$EVIDENCE_ROOT/platform.txt"
            cat /etc/os-release >> "$EVIDENCE_ROOT/platform.txt"
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = X64
          '
          run_logged "$EVIDENCE_ROOT/node-platform.log" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { batches, matrix, parseOptions, readLock, validateProvenance } from './frontend/test/shareGoldenProvenance.mjs';
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'x64');
          assert.match(process.version, /^v22\./);
          const selectors = ['1', '2', '3', '4', '5', 'trace', 'forged-days-week', 'forged-days-month', 'forged-days-milestone', 'forged-days-count'];
          assert.deepEqual(Object.keys(batches), selectors);
          assert.equal(matrix.length, 72);
          for (const batch of selectors) {
            const options = parseOptions([`--capture-batch=${batch}`, '--platform=linux-x64', `--output=${process.env.EVIDENCE_ROOT}/pass-a`]);
            assert.equal(options.mode, 'capture');
            assert.ok(options.selected.length + 1 <= 10);
          }
          const lock = readLock();
          validateProvenance(lock, lock.runtime);
          const receipt = { source: process.env.GITHUB_SHA, platform: process.platform, arch: process.arch,
            node: process.version, expectedRuntime: lock.runtime, fingerprints: lock.fingerprints, selectors };
          writeFileSync(join(process.env.EVIDENCE_ROOT, 'source-platform.json'), JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx' });
          console.log(JSON.stringify(receipt, null, 2));
          NODE
          run_logged "$EVIDENCE_ROOT/npm-ci.log" npm --prefix frontend ci
          (
            cd frontend
            run_logged "$EVIDENCE_ROOT/chromium-install.log" npx --no-install playwright install --with-deps chromium
          )

          for pass in pass-a pass-b; do
            output="$EVIDENCE_ROOT/$pass"
            mkdir "$output"
            run_logged "$output/preflight.log" bash -euo pipefail -c '
              output="$1"
              uname -a > "$output/platform.txt"
              cat /etc/os-release >> "$output/platform.txt"
              cp "$EVIDENCE_ROOT/source-platform.json" "$output/source-platform.json"
              git rev-parse HEAD > "$output/source-sha.txt"
              test "$(cat "$output/source-sha.txt")" = "$GITHUB_SHA"
              test -z "$(git status --porcelain --untracked-files=all)"
            ' _ "$output"
            run_logged "$output/batch1.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=1 --platform=linux-x64 --output="$output"
            run_logged "$output/batch2.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=2 --platform=linux-x64 --output="$output"
            run_logged "$output/batch3.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=3 --platform=linux-x64 --output="$output"
            run_logged "$output/batch4.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=4 --platform=linux-x64 --output="$output"
            run_logged "$output/batch5.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=5 --platform=linux-x64 --output="$output"
            run_logged "$output/trace.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=trace --platform=linux-x64 --output="$output"
            run_logged "$output/forged-days-week.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=forged-days-week --platform=linux-x64 --output="$output"
            run_logged "$output/forged-days-month.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=forged-days-month --platform=linux-x64 --output="$output"
            run_logged "$output/forged-days-milestone.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=forged-days-milestone --platform=linux-x64 --output="$output"
            run_logged "$output/forged-days-count.log" node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=forged-days-count --platform=linux-x64 --output="$output"
          done

          # Read-only validation uses the unchanged source/receipt/hash assertions.
          run_logged "$EVIDENCE_ROOT/verification.log" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import {
            matrix, batchCount, readLock, validateProvenance, validateReceipt,
            receiptPath, sha256,
          } from './frontend/test/shareGoldenProvenance.mjs';

          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'x64');
          assert.equal(matrix.length, 72);
          assert.equal(batchCount, 10);
          const lock = readLock();
          validateProvenance(lock, lock.runtime);
          const manifests = [];
          for (const pass of ['pass-a', 'pass-b']) {
            const base = join(process.env.EVIDENCE_ROOT, pass);
            assert.equal(readFileSync(join(base, 'source-sha.txt'), 'utf8').trim(), process.env.GITHUB_SHA);
            const receiptBytes = readFileSync(receiptPath('linux-x64', base));
            const receipt = JSON.parse(receiptBytes);
            assert.equal(receipt.host.node, process.version);
            const pngs = validateReceipt(receipt, lock, 'linux-x64', true, readFileSync, readdirSync, base);
            assert.equal(pngs.size, 72);
            const entries = [...pngs].map(([name, bytes]) => [name, sha256(bytes)])
              .sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0);
            const manifest = entries.map(([name, hash]) => `${hash}  ${name}\n`).join('');
            writeFileSync(join(base, 'png-sha256.txt'), manifest, { flag: 'wx' });
            console.log(`${pass}: complete receipt; 72 PNGs; generation-v3.json sha256=${sha256(receiptBytes)}; PNG manifest sha256=${sha256(manifest)}`);
            manifests.push(entries);
          }
          assert.deepEqual(manifests[0], manifests[1], 'Pass A/B PNG names or SHA-256 hashes differ');
          console.log('PASS: all 72 PNG names and SHA-256 hashes match; capture evidence only, not pixel approval.');
          NODE
          cat "$EVIDENCE_ROOT/verification.log" >> "$summary"
          run_logged "$EVIDENCE_ROOT/checkout-after-success.log" bash -euo pipefail -c '
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test -z "$(git status --porcelain --untracked-files=all)"
          '
          printf 'exact-source and clean-checkout verification exit=0\n' >> "$summary"

      # Always retain hashes of partial roots, even if a batch/validator failed.
      # This step never repairs or resets a changed checkout: mutation fails the job.
      - name: Inventory partial evidence and require unchanged checkout
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          summary="$EVIDENCE_ROOT/summary.txt"
          trap 'status=$?; printf "inventory-step exit=%s\n" "$status" >> "$summary"' EXIT
          printf 'command: inventory raw PNG hashes and verify exact clean checkout\n' >> "$summary"
          if node --input-type=module <<'NODE' 2>&1 | tee "$EVIDENCE_ROOT/inventory.log"
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const root = process.env.EVIDENCE_ROOT;
          const walk = dir => readdirSync(dir, { withFileTypes: true }).flatMap(entry =>
            entry.isDirectory() ? walk(join(dir, entry.name)) : [join(dir, entry.name)]);
          for (const pass of ['pass-a', 'pass-b']) {
            const base = join(root, pass);
            const files = existsSync(base) ? walk(base).filter(file => /\.png$/i.test(file)).sort() : [];
            const manifest = files.map(file => `${createHash('sha256').update(readFileSync(file)).digest('hex')}  ${relative(base, file)}\n`).join('');
            writeFileSync(join(root, `${pass}-raw-png-sha256.txt`), manifest);
            console.log(`${pass}: ${files.length} raw PNGs inventoried; completeness is asserted separately`);
          }
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const status = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' });
          writeFileSync(join(root, 'source-sha-after.txt'), head + '\n');
          writeFileSync(join(root, 'checkout-after.txt'), status);
          assert.equal(head, process.env.GITHUB_SHA);
          assert.equal(status, '', 'Repository mutation forbidden; checkout was not reset');
          console.log('PASS: exact source SHA and clean checkout after capture attempt');
          NODE
          then
            statuses=("${PIPESTATUS[@]}")
          else
            statuses=("${PIPESTATUS[@]}")
          fi
          printf 'inventory exit=%s tee-exit=%s\n' "${statuses[0]}" "${statuses[1]}" >> "$summary"
          sha256sum "$EVIDENCE_ROOT/inventory.log" >> "$summary"
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi

      # Failure artifacts retain partial evidence; job failure is never overridden.
      - name: Upload both capture roots, raw logs, receipts and command/hash summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-golden-capture-v3-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14
