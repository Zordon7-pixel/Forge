name: C1 bounded Linux diagnosis (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c1-diagnosis:
    if: github.ref == 'refs/heads/oracle/t_f8fc63a7-c1-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [default, no-hint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install same locked Chromium as canonical CI
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture diagnostics then run unchanged acceptance assertions
        env:
          C1_DIAGNOSTIC_DIR: c1-diagnostic
          C1_DIAGNOSTIC_PRESET: ${{ matrix.preset }}
        run: |
          mkdir -p c1-diagnostic
          uname -a > c1-diagnostic/platform.txt
          cat /etc/os-release >> c1-diagnostic/platform.txt
          node frontend/test/shareOverlaysC1.smoke.mjs 2>&1 | tee c1-diagnostic/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-linux-${{ matrix.preset }}
          path: c1-diagnostic
          if-no-files-found: error
          retention-days: 14
