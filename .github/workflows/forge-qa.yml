name: Forged Hybrid QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: forge-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-support-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify event checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          sha256sum backend/package-lock.json frontend/package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Run frontend smoke suite
        run: npm --prefix frontend run test:smoke
      - name: Verify account-data coverage
        run: npm --prefix backend run check:account-data
      - name: Audit production dependencies
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build frontend
        run: npm --prefix frontend run build

  backend-smoke-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base-0
            arguments: --ci-shard-index 0 --ci-shard-count 4
          - label: base-1
            arguments: --ci-shard-index 1 --ci-shard-count 4
          - label: base-2
            arguments: --ci-shard-index 2 --ci-shard-count 4
          - label: base-3
            arguments: --ci-shard-index 3 --ci-shard-count 4
          - label: route-positive
            arguments: --ci-route-positive
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify event checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          sha256sum backend/package-lock.json frontend/package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Run assigned backend invocations
        run: |
          mkdir -p "$RUNNER_TEMP/forge-smoke-receipts"
          node backend/scripts/run-smoke-suite.js ${{ matrix.arguments }} --receipt "$RUNNER_TEMP/forge-smoke-receipts/${{ matrix.label }}.json"
      - name: Upload exact backend receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-backend-smoke-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/forge-smoke-receipts/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 7

  # Keep the required deterministic check identity; no partial union is green.
  deterministic-qa:
    if: ${{ always() }}
    needs: [deterministic-support-qa, backend-smoke-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify event checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          sha256sum backend/package-lock.json frontend/package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Download exact backend receipts
        uses: actions/download-artifact@v4
        with:
          pattern: forge-backend-smoke-*-${{ github.sha }}
          path: ${{ runner.temp }}/forge-smoke-receipts
          merge-multiple: false
      - name: Require complete independent backend union and support success
        env:
          SUPPORT_RESULT: ${{ needs.deterministic-support-qa.result }}
          BACKEND_RESULT: ${{ needs.backend-smoke-qa.result }}
        run: node backend/scripts/verify-smoke-receipts.js --receipts-dir "$RUNNER_TEMP/forge-smoke-receipts"

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser journeys
        run: npm run qa:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Keep the previous check identity while requiring both independent jobs.
  deterministic-and-browser-qa:
    if: ${{ always() }}
    needs: [deterministic-qa, browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require deterministic and browser success
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic-qa.result }}
          BROWSER_RESULT: ${{ needs.browser-qa.result }}
        run: test "$DETERMINISTIC_RESULT" = success && test "$BROWSER_RESULT" = success

  ios-native-compile:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build and sync Capacitor iOS
        run: |
          npm --prefix frontend run build
          cd frontend && npx cap sync ios
      - name: Verify native contracts and generated project stability
        run: |
          npm run qa:native
          git diff --exit-code -- frontend/ios frontend/capacitor.config.ts frontend/app.json
      - name: Compile iOS app and Live Activity extension without signing
        working-directory: frontend/ios/App
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ForgeDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  production-shell-qa:
    if: github.event_name != 'pull_request'
    needs: [deterministic-qa, browser-qa, deterministic-and-browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Export expected pushed revision and bundle identity
        if: github.event_name != 'schedule'
        run: |
          npm --prefix frontend run build
          echo "FORGE_QA_EXPECTED_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          node frontend/scripts/export-built-entry.mjs >> "$GITHUB_ENV"
      - name: Wait for the pushed Railway shell
        env:
          FORGE_QA_BASE_URL: https://forge-production-773f.up.railway.app
        run: npm --prefix frontend run wait:production
      - name: Verify live production shell and service worker
        env:
          FORGE_QA_BASE_URL: https://forge-production-773f.up.railway.app
        run: npm run qa:production
      - name: Upload production browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-production-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
