name: P3 exact-SHA Linux QA (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-exact-linux-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ec8bbb9c657c38c74aa807478088dee30cbe0262

jobs:
  deterministic:
    if: github.ref == 'refs/heads/oracle/t_b10c101d-linux-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ec8bbb9c657c38c74aa807478088dee30cbe0262
          fetch-depth: 0
      - name: Set up locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Run deterministic, contract, build, and audit gates
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/p3-linux-deterministic"
          mkdir -p "$EVIDENCE"
          printf 'name\tcommand\texit\tlog_sha256\n' > "$EVIDENCE/commands.tsv"
          overall=0
          run_gate() {
            local name="$1"
            shift
            local log="$EVIDENCE/$name.log"
            local command
            printf -v command '%q ' "$@"
            set +e
            "$@" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            local digest
            digest="$(sha256sum "$log" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$command" "$rc" "$digest" >> "$EVIDENCE/commands.tsv"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          }
          run_gate frontend-ci npm --prefix frontend ci
          run_gate backend-ci npm --prefix backend ci
          run_gate qa-smoke npm run qa:smoke
          run_gate account-data npm --prefix backend run check:account-data
          run_gate frontend-audit npm --prefix frontend audit --audit-level=high
          run_gate backend-audit npm --prefix backend audit --audit-level=high
          run_gate frontend-build npm --prefix frontend run build
          run_gate native-contracts npm run qa:native
          printf '%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE/source-sha.txt"
          uname -a > "$EVIDENCE/platform.txt"
          cat /etc/os-release >> "$EVIDENCE/platform.txt"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,npm:process.env.npm_config_user_agent})' >> "$EVIDENCE/platform.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then overall=1; fi
          if [ -n "$(git status --porcelain=v1)" ]; then
            git status --porcelain=v1 > "$EVIDENCE/git-status.txt"
            overall=1
          fi
          exit "$overall"
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-linux-deterministic-ec8bbb9c
          path: ${{ runner.temp }}/p3-linux-deterministic
          if-no-files-found: error
          retention-days: 14

  browser:
    if: github.ref == 'refs/heads/oracle/t_b10c101d-linux-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ec8bbb9c657c38c74aa807478088dee30cbe0262
          fetch-depth: 0
      - name: Set up locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Run browser journeys
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/p3-linux-browser"
          mkdir -p "$EVIDENCE"
          printf 'name\tcommand\texit\tlog_sha256\n' > "$EVIDENCE/commands.tsv"
          overall=0
          run_gate() {
            local name="$1"
            shift
            local log="$EVIDENCE/$name.log"
            local command
            printf -v command '%q ' "$@"
            set +e
            "$@" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            local digest
            digest="$(sha256sum "$log" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$command" "$rc" "$digest" >> "$EVIDENCE/commands.tsv"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          }
          run_gate frontend-ci npm --prefix frontend ci
          run_gate backend-ci npm --prefix backend ci
          run_gate playwright-install bash -lc 'cd frontend && npx playwright install --with-deps chromium'
          run_gate browser-qa npm run qa:browser
          printf '%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE/source-sha.txt"
          uname -a > "$EVIDENCE/platform.txt"
          cat /etc/os-release >> "$EVIDENCE/platform.txt"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,npm:process.env.npm_config_user_agent})' >> "$EVIDENCE/platform.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then overall=1; fi
          if [ -n "$(git status --porcelain=v1)" ]; then
            git status --porcelain=v1 > "$EVIDENCE/git-status.txt"
            overall=1
          fi
          exit "$overall"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-linux-browser-ec8bbb9c
          path: |
            ${{ runner.temp }}/p3-linux-browser
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  p3-exact:
    if: github.ref == 'refs/heads/oracle/t_b10c101d-linux-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ec8bbb9c657c38c74aa807478088dee30cbe0262
          fetch-depth: 0
      - name: Set up locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Run P3 exact focused, byte-export, golden, and provenance gates
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/p3-linux-exact"
          mkdir -p "$EVIDENCE"
          printf 'name\tcommand\texit\tlog_sha256\n' > "$EVIDENCE/commands.tsv"
          overall=0
          run_gate() {
            local name="$1"
            shift
            local log="$EVIDENCE/$name.log"
            local command
            printf -v command '%q ' "$@"
            set +e
            "$@" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            local digest
            digest="$(sha256sum "$log" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$command" "$rc" "$digest" >> "$EVIDENCE/commands.tsv"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          }
          run_gate frontend-ci npm --prefix frontend ci
          run_gate backend-ci npm --prefix backend ci
          run_gate playwright-install bash -lc 'cd frontend && npx playwright install --with-deps chromium'
          run_gate share-context node backend/test/activityShareContext.smoke.js
          run_gate share-context-honolulu env TZ=Pacific/Honolulu node backend/test/activityShareContext.smoke.js
          run_gate share-context-tokyo env TZ=Asia/Tokyo node backend/test/activityShareContext.smoke.js
          run_gate run-linked-time-pr node backend/test/runLinkedTimePr.smoke.js
          run_gate run-recap-data node backend/test/runRecapData.smoke.js
          run_gate activity-share-entry node frontend/test/activityShareEntry.smoke.mjs
          run_gate share-stats node frontend/test/shareStats.smoke.mjs
          run_gate studio-phase-c node frontend/test/activityShareStudioPhaseC.smoke.mjs
          run_gate studio-single-flight node frontend/test/activityShareStudioSingleFlight.smoke.mjs
          run_gate release-templates node frontend/test/shareReleaseTemplates.smoke.mjs
          run_gate c2-contracts node frontend/test/shareOverlaysC2.smoke.mjs
          run_gate c1-filter-only node frontend/test/shareOverlaysC1.smoke.mjs --filter-only
          run_gate framework-modules node frontend/test/shareFrameworkModules.smoke.mjs
          run_gate export-metadata-helper node frontend/test/shareExportMetadata.mjs
          run_gate syntax-studio node --check frontend/test/activityShareStudioFramework.smoke.mjs
          run_gate syntax-runs node --check backend/src/routes/runs.js
          run_gate studio-framework-browser node frontend/test/activityShareStudioFramework.smoke.mjs
          run_gate golden-aggregate node frontend/test/shareOverlaysC1.smoke.mjs
          run_gate golden-c1 node frontend/test/shareOverlaysC1.smoke.mjs --compare=c1
          run_gate golden-photo node frontend/test/shareOverlaysC1.smoke.mjs --compare=photo
          run_gate golden-c2 node frontend/test/shareOverlaysC1.smoke.mjs --compare=c2
          run_gate provenance-aggregate node frontend/test/shareGoldenProvenance.mjs
          run_gate provenance-negatives node frontend/test/shareGoldenProvenance.smoke.mjs
          run_gate provenance-rollover node frontend/test/shareGoldenRollover.smoke.mjs
          printf '%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE/source-sha.txt"
          uname -a > "$EVIDENCE/platform.txt"
          cat /etc/os-release >> "$EVIDENCE/platform.txt"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,npm:process.env.npm_config_user_agent})' >> "$EVIDENCE/platform.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then overall=1; fi
          if [ -n "$(git status --porcelain=v1)" ]; then
            git status --porcelain=v1 > "$EVIDENCE/git-status.txt"
            overall=1
          fi
          exit "$overall"
      - name: Upload exact P3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-linux-exact-ec8bbb9c
          path: ${{ runner.temp }}/p3-linux-exact
          if-no-files-found: error
          retention-days: 14
