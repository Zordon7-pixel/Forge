name: Forged Hybrid QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: forge-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run deterministic smoke suites
        run: npm run qa:smoke
      - name: Verify account-data coverage
        run: npm --prefix backend run check:account-data
      - name: Audit production dependencies
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run mobile browser journeys
        run: npm run qa:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  ios-native-compile:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build and sync Capacitor iOS
        run: |
          npm --prefix frontend run build
          cd frontend && npx cap sync ios
      - name: Verify native contracts and generated project stability
        run: |
          npm run qa:native
          git diff --exit-code -- frontend/ios frontend/capacitor.config.ts frontend/app.json
      - name: Compile iOS app and Live Activity extension without signing
        working-directory: frontend/ios/App
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ForgeDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  production-shell-qa:
    if: github.event_name != 'pull_request'
    needs: deterministic-and-browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Export expected pushed revision and bundle identity
        if: github.event_name != 'schedule'
        run: |
          npm --prefix frontend run build
          echo "FORGE_QA_EXPECTED_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          node frontend/scripts/export-built-entry.mjs >> "$GITHUB_ENV"
      - name: Wait for the pushed Railway shell
        env:
          FORGE_QA_BASE_URL: https://forge-production-773f.up.railway.app
        run: npm --prefix frontend run wait:production
      - name: Verify live production shell and service worker
        env:
          FORGE_QA_BASE_URL: https://forge-production-773f.up.railway.app
        run: npm run qa:production
      - name: Upload production browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-production-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
