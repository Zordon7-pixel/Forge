name: Forged Hybrid QA

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: forge-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run deterministic smoke suites
        run: npm run qa:smoke
      - name: Verify account-data coverage
        run: npm --prefix backend run check:account-data
      - name: Audit production dependencies
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run mobile browser journeys
        run: npm run qa:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
