name: P3 v4 Linux share capture (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-v4-linux-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/oracle/t_b10c101d-linux-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [complete, repeat]
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ba0288551bdea71539b25f9fe0faf6c27a0a3f82
          fetch-depth: 0
      - name: Set up locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Install locked Chromium and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture all ten v4 batches
        env:
          CAPTURE_LANE: ${{ matrix.lane }}
          EXPECTED_SOURCE_SHA: ba0288551bdea71539b25f9fe0faf6c27a0a3f82
          OUTPUT_DIR: ${{ runner.temp }}/forge-share-${{ matrix.lane }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUTPUT_DIR"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"
          uname -a > "$OUTPUT_DIR/platform.txt"
          cat /etc/os-release >> "$OUTPUT_DIR/platform.txt"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})' >> "$OUTPUT_DIR/platform.txt"
          printf '%s\n' "$actual_sha" > "$OUTPUT_DIR/source-sha.txt"
          printf 'lane\tbatch\tcommand\texit\n' > "$OUTPUT_DIR/commands.tsv"

          run_batch() {
            local batch="$1"
            local log="$OUTPUT_DIR/$batch.log"
            local command="node frontend/test/shareOverlaysC1.smoke.mjs --capture-batch=$batch --platform=linux-x64 --output=$OUTPUT_DIR"
            set +e
            node frontend/test/shareOverlaysC1.smoke.mjs \
              "--capture-batch=$batch" \
              --platform=linux-x64 \
              "--output=$OUTPUT_DIR" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            printf '%s\t%s\t%s\t%s\n' "$CAPTURE_LANE" "$batch" "$command" "$rc" >> "$OUTPUT_DIR/commands.tsv"
            test "$rc" -eq 0
          }

          run_batch 1
          run_batch 2
          run_batch 3
          run_batch 4
          run_batch 5
          run_batch trace
          run_batch forged-days-week
          run_batch forged-days-month
          run_batch forged-days-milestone
          run_batch forged-days-count

          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"
          test -f "$OUTPUT_DIR/generation-v4.json"
          sha256sum "$OUTPUT_DIR/generation-v4.json" > "$OUTPUT_DIR/generation-v4.sha256"
      - name: Upload raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-share-linux-v4-${{ matrix.lane }}
          path: ${{ runner.temp }}/forge-share-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 14
